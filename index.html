
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đóa hoa dành tặng em 🌸</title>
    <meta name="description" content="Một đóa hoa nhỏ dành tặng bạn.">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="scene">

        <!-- Ánh sáng trang trí -->
        <div class="glow"></div>

        <!-- Đóa hoa -->
        <div class="flower">
            <div class="petals">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="center"></div>
        </div>

        <!-- Thân cây -->
        <div class="stem"></div>

        <!-- Lá cây -->
        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>

        <!-- Mặt đất -->
        <div class="ground"></div>

        <!-- Lời nhắn -->
        <p class="message">Tặng em một đóa hoa 🌸</p>
        <p class="subtitle">Chúc em sẽ luôn vui vẻ và hạnh phúc. (Đây là bản demo thôi, anh sẽ cải tiến dần dần ạ)</p>

    </main>
</body>
</html>
