
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Một món quà dành cho em 🌻</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="scene">
        <div class="sparkles" aria-hidden="true"></div>

        <p class="subtitle">A LITTLE GIFT FOR YOU</p>

        <h1 id="title">Em có một món quà!</h1>

        <!-- Hộp quà -->
        <button
            class="gift"
            id="gift"
            aria-label="Nhấn để mở hộp quà"
            aria-expanded="false"
        >
            <span class="gift-lid">
                <span class="ribbon bow"></span>
            </span>

            <span class="gift-box">
                <span class="ribbon ribbon-vertical"></span>
                <span class="ribbon ribbon-horizontal"></span>
            </span>
        </button>

        <p class="hint" id="hint">
            Em nhấn vào hộp quà đi 💝
        </p>

        <!-- Đóa hoa hướng dương -->
        <div class="flower-container" id="flower">
            <svg
                class="sunflower"
                viewBox="0 0 240 310"
                role="img"
                aria-label="Đóa hoa hướng dương vàng"
            >
                <!-- Thân hoa -->
                <path
                    class="stem"
                    d="M120 135 C118 185 130 220 120 275"
                    fill="none"
                    stroke="#43864B"
                    stroke-width="7"
                    stroke-linecap="round"
                />

                <!-- Lá bên trái -->
                <path
                    class="leaf"
                    d="M119 220 Q65 183 62 211 Q83 242 119 220Z"
                    fill="#5AAB63"
                />

                <!-- Lá bên phải -->
                <path
                    class="leaf"
                    d="M124 246 Q169 211 179 233 Q163 258 124 246Z"
                    fill="#43864B"
                />

                <!-- Cánh hoa -->
                <g class="petals">
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFD54F"/>
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFCA28" transform="rotate(30 120 105)"/>
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFD54F" transform="rotate(60 120 105)"/>
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFCA28" transform="rotate(90 120 105)"/>
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFD54F" transform="rotate(120 120 105)"/>
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFCA28" transform="rotate(150 120 105)"/>
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFD54F" transform="rotate(180 120 105)"/>
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFCA28" transform="rotate(210 120 105)"/>
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFD54F" transform="rotate(240 120 105)"/>
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFCA28" transform="rotate(270 120 105)"/>
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFD54F" transform="rotate(300 120 105)"/>
                    <ellipse cx="120" cy="62" rx="15" ry="32"
                        fill="#FFCA28" transform="rotate(330 120 105)"/>
                </g>

                <!-- Nhụy hoa -->
                <circle cx="120" cy="105" r="37" fill="#75421E"/>
                <circle cx="120" cy="105" r="32" fill="#583019"/>

                <!-- Hạt nhỏ trên nhụy -->
                <g fill="#D99B42">
                    <circle cx="106" cy="94" r="2.5"/>
                    <circle cx="121" cy="88" r="2.5"/>
                    <circle cx="135" cy="99" r="2.5"/>
                    <circle cx="111" cy="111" r="2.5"/>
                    <circle cx="126" cy="116" r="2.5"/>
                    <circle cx="139" cy="115" r="2.5"/>
                    <circle cx="118" cy="101" r="2.5"/>
                    <circle cx="101" cy="105" r="2.5"/>
                    <circle cx="129" cy="95" r="2.5"/>
                    <circle cx="114" cy="125" r="2.5"/>
                    <circle cx="133" cy="126" r="2.5"/>
                </g>
            </svg>
        </div>

        <!-- Lời chúc -->
        <section class="message" id="message" aria-live="polite">
            <h2>Gửi cho em 🌻</h2>

            <p>
                Mong em có thể gặp những chuyện vui vẻ, bình an và hạnh phúc.
                Như hoa hướng dương vậy, sẽ luôn có thể có ảnh mặt trời của em và hướng về đó ạ
            </p>

            <p class="signature">Luôn tỏa sáng như hoa hướng dương ✨</p>
        </section>

        <button class="replay" id="replay">
            Mở quà lần nữa ↻
        </button>
    </main>
</body>
</html>
